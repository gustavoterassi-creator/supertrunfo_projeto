<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Super Trunfo Coleção</title>
</head>
<body>
    <main>
        <!-- Card 1: Corinthians -->
        <div class="card">
            <h2>Corinthians</h2>
            <img src="images.png" alt="Escudo do Corinthians">
            <div class="carta">
                <p><strong>Idade:</strong> 116 anos</p>
                <p><strong>Títulos:</strong> 54</p>
                <p><strong>Torcida:</strong> 30,4 milhões</p>
                <p><strong>Vitórias:</strong> 3.200</p>
            </div>
        </div>

        <!-- Card 2: Messi -->
        <div class="card">
            <h2>Messi</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSL5JXL_mxdZLiDzE0gx0af9wyWQ2g4-bQHbh-uSLFQQ&s=10" alt="Lionel Messi">
            <div class="carta">
                <p><strong>Idade:</strong> 39 anos</p>
                <p><strong>Títulos:</strong> 49 títulos</p>
                <p><strong>Bola de ouro:</strong> 8</p>
                <p><strong>Gols:</strong> 934 gols</p>
            </div>
        </div>

        <!-- Card 3: Palmeiras -->
        <div class="card">
            <h2>Palmeiras</h2>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDAbzZUb6XKip3idTnB9jCHT21tbIpdpltRBw6ZdNwtw&s=10" alt="Escudo do Palmeiras">
            <div class="carta">
                <p><strong>Idade:</strong> 112 anos</p>
                <p><strong>Títulos:</strong> 51</p>
                <p><strong>Torcida:</strong> 16,0 milhões</p>
                <p><strong>Vitórias:</strong> 2.400</p>
            </div>
        </div>
    </main>

</body>
</html>
